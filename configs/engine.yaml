# Perfil para ejecución con TensorRT (.engine) en GPU NVIDIA (ej. Colab L4)
name: engine
model_format: engine
device: 0

# Variables principales (se pueden sobreescribir con --video y --model en CLI)
video: "/content/partido.mp4"
output_dir: "outputs/engine"

models:
  ball: "/content/models/ball/best.engine"
  player: "/content/models/player/best.engine"
  homography: "/content/models/homography/best.engine"

inference:
  imgsz: 1280
  conf: 0.25
  max_frames: null          # null para todo el video
  frame_stride: 1
  write_raw_video: false
  log_interval: 100

ball:
  class_id: 0
  run_postprocess: true
  postprocess:
    high_conf: 0.45
    low_conf: 0.20
    nms_dist_px: 20.0
    max_link_gap: 4
    base_gate_px: 25.0
    max_speed_px: 25.0
    static_min_frames: 15
    static_max_disp_px: 12.0
    max_interp_gap: 75
    max_tail_extrap: 5
    render_video: true

player:
  classes: [1, 2, 3]        # 1: goalkeeper, 2: player, 3: referee (excluye 0: ball)
  exclude_classes: [0]
  conf: 0.20
  run_postprocess: true
  postprocess:
    high_conf: 0.45
    low_conf: 0.20
    nms_dist_px: 20.0
    nms_iou_thresh: 0.70
    max_link_gap: 6
    base_gate_px: 25.0
    max_speed_px: 8.0
    max_stitch_gap: 35
    max_stitch_dist_px: 120.0
    min_track_frames: 3
    static_min_frames: 45
    static_max_disp_px: 8.0
    max_interp_gap: 35
    max_tail_extrap: 0
    render_video: true

homography:
  conf: 0.25
